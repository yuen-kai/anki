syntax = "proto3";

option java_multiple_files = true;

package anki.frontend;

import "anki/scheduler.proto";
import "anki/generic.proto";
import "anki/search.proto";

service FrontendService {
  // Returns values from the reviewer
  rpc GetSchedulingStatesWithContext(generic.Empty)
      returns (SchedulingStatesWithContext);
  // Updates reviewer state
  rpc SetSchedulingStates(SetSchedulingStatesRequest) returns (generic.Empty);

  // Notify Qt layer so window modality can be updated.
  rpc ImportDone(generic.Empty) returns (generic.Empty);

  rpc SearchInBrowser(search.SearchNode) returns (generic.Empty);

  // Force closing the deck options.
  rpc deckOptionsRequireClose(generic.Empty) returns (generic.Empty);
  // Warns python that the deck option web view is ready to receive requests.
  rpc deckOptionsReady(generic.Empty) returns (generic.Empty);

  // Save colour picker's custom colour palette
  rpc SaveCustomColours(generic.Empty) returns (generic.Empty);

  // Qt-only Speedrun navigation + dialog actions (desktop). These drive the Qt
  // window state machine / open Qt dialogs, so they cannot move to the shared
  // engine; they stay Python handlers in mediasrv. On mobile the SvelteKit
  // shell degrades them per-platform (client-side routing for navigation; the
  // dialog affordances are hidden), so no equivalent RPC is needed there.
  //
  // Request: { deckId } -> moves the window to the deck's overview.
  rpc SpeedrunOpenDeck(generic.Json) returns (generic.Json);
  // Request: { deckId } -> arms the study session and moves to the reviewer.
  rpc SpeedrunStartStudy(generic.Json) returns (generic.Json);
  // Request: { action } where action is one of options | customStudy | unbury |
  // description | rebuild | empty -> runs the matching deck-overview action.
  rpc SpeedrunOverviewAction(generic.Json) returns (generic.Json);
  // Request: {} -> moves the window back to the decks home (deckBrowser).
  rpc SpeedrunShowDecks(generic.Json) returns (generic.Json);

  // Speedrun accounts + sync: the account screen posts these to the mediasrv
  // Python handlers (speedrun_sync_login / _sync_now / _sign_out /
  // _sync_status), which drive Anki's own native sync login against the
  // self-hosted server (SimpleServer) with a username + password. They touch Qt
  // profile/sync state, so they stay Python handlers rather than moving to the
  // shared engine.
  //
  // Request: { username, password, endpoint } -> { ok, account?, endpoint?,
  // message? }; logs in and stores the returned sync key.
  rpc SpeedrunSyncLogin(generic.Json) returns (generic.Json);
  // Request: {} -> { ok, message }; starts a normal collection sync.
  rpc SpeedrunSyncNow(generic.Json) returns (generic.Json);
  // Request: {} -> { ok }; drops the stored sync credentials.
  rpc SpeedrunSignOut(generic.Json) returns (generic.Json);
  // Request: {} -> { loggedIn, account?, endpoint?, hostAvailable }.
  rpc SpeedrunSyncStatus(generic.Json) returns (generic.Json);

  // The data RPCs the deck/authoring/study screens call (list decks, get/save/
  // delete hierarchy, study summary) and the card-study screen's RPCs
  // (SpeedrunStudyState / NextCard / AnswerCard / RecordLearned /
  // StudyHierarchy) are driven by the shared Rust engine, not Python: they live
  // on SchedulerService (see anki/scheduler.proto) so desktop and AnkiDroid
  // share one backend.
}

service BackendFrontendService {}

message SchedulingStatesWithContext {
  scheduler.SchedulingStates states = 1;
  scheduler.SchedulingContext context = 2;
}

message SetSchedulingStatesRequest {
  string key = 1;
  scheduler.SchedulingStates states = 2;
}
